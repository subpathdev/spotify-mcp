{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spotify-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spotify-mcp.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with .Values.networkPolicy.mcpFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: mcp
    {{- end }}
    {{- with .Values.networkPolicy.webFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: web
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
