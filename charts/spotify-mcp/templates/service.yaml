apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spotify-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "spotify-mcp.selector" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
    - name: web
      port: {{ .Values.service.webPort }}
      targetPort: web
